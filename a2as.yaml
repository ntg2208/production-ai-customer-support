    args: [from_location, to_location, departure_date, limit]
    params:
      returns: Dict
  search_tickets_by_city:
    type: sync
    module: tools.ticket_tools
    args: [city_name, departure_date, limit]
    params:
      returns: Dict
  search_tickets_from_city:
    type: sync
    module: tools.ticket_tools
    args: [from_city, departure_date, ticket_type, limit]
    params:
      returns: Dict
  search_tickets_to_city:
    type: sync
    module: tools.ticket_tools
    args: [to_city, departure_date, limit]
    params:
      returns: Dict
  set_model_id:
    type: sync
    module: config.model_config
    args: [agent_type, model_id]
  set_vector_db:
    type: sync
    module: tools.policy_search
    args: [vector_db]
  setup_policy_vector_db:
    type: sync
    module: sub_agents.policy_agent
  setup_realistic_customer_state:
    type: async
    module: run_test_scenarios
    args: [session_key]
  to_dict:
    type: sync
    module: evaluation.reporter
    args: [self]
    params:
      returns: Dict
  validate_booking_reference:
    type: sync
    module: tools.ticket_tools
    args: [booking_ref]
    params:
      returns: None
  validate_date_format:
    type: sync
    module: tools.ticket_tools
    args: [date_str]
    params:
      returns: None
  validate_email:
    type: sync
    module: tools.ticket_tools
    args: [email]
    params:
