    module: utils.populate_data
    args: [db_path]

variables:
  env_var:
    type: env
    params:
      caller: [os.getenv]
      path: [config.model_config]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [evaluation.evaluator]

files:
  "..":
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ".."]
  ../..:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../..]
  ../../database/ukconnect_rag_chunks.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../../database/ukconnect_rag_chunks.json]
  ../../database/vector_db.pkl:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../../database/vector_db.pkl]
  args.from_file:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  customer_setup.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), utils, customer_setup.py]
  data_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  database.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), "..", database, database.py]
  db_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.abspath]
  event_logger.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), utils, event_logger.py]
  filepath:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  output_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  prompt.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), prompt.py]
  ukconnect_rail.db:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [script_dir, "..", database, ukconnect_rail.db]
  vector_db_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
